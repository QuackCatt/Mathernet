[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathernet"
version = "0.1.0"
description = "A source-backed formula knowledge-graph learning assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mathernet team" }]
dependencies = []

[project.scripts]
mathernet = "mathernet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mathernet*"]

[tool.setuptools.package-data]
mathernet = ["skills/*.md"]
